spring.application.name=gym-backend

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gymdb}
spring.datasource.username=${DB_USERNAME:gymuser}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=${JWT_SECRET}
app.jwt.expiry-ms=${JWT_EXPIRY_MS:3600000}

app.bootstrap.admin.name=${ADMIN_NAME}
app.bootstrap.admin.email=${ADMIN_EMAIL}
app.bootstrap.admin.password=${ADMIN_PASSWORD}

file.upload-dir=uploads/customers

app.storage.root-path=D:/FullStack Course Learning/mini-Projects/Project1/gym-data
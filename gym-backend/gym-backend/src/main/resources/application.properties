spring.application.name=gym-backend

# --- Active profile ---
# Defaults to 'dev' for local work. Set SPRING_PROFILES_ACTIVE=prod in your deployment
# environment to load application-prod.properties (see below), which disables SQL
# logging and switches ddl-auto to 'validate' instead of 'update'.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# --- Datasource ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gymdb}
spring.datasource.username=${DB_USERNAME:gymuser}
spring.datasource.password=${DB_PASSWORD}

# --- JPA / Hibernate ---
# ddl-auto and show-sql are now profile-specific (see application-dev.properties /
# application-prod.properties) rather than hardcoded here for every environment.
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
# --- JWT ---
app.jwt.secret=${JWT_SECRET}
app.jwt.expiry-ms=${JWT_EXPIRY_MS:3600000}

# --- Bootstrap admin (created once on first startup if it doesn't already exist) ---
app.bootstrap.admin.name=${ADMIN_NAME}
app.bootstrap.admin.email=${ADMIN_EMAIL}
app.bootstrap.admin.password=${ADMIN_PASSWORD}

# --- File storage ---
file.upload-dir=uploads/customers
# Previously hardcoded to a Windows dev path (D:/FullStack Course Learning/...), which
# would break on any Linux/macOS/container deployment. Now fully environment-driven with
# a sane relative default for local dev.
app.storage.root-path=${APP_STORAGE_ROOT_PATH:./gym-data}

# --- CORS ---
# Comma-separated list; defaults to the Vite dev server origin only.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# --- Upload limits (backs the MaxUploadSizeExceededException handler added to
# GlobalExceptionHandler) ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB